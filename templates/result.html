<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Analysis Result</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <div class="container">

        <h1>Analysis Result</h1>

        <div class="card">

            <h2>File Name</h2>

            <p>{{ file_name }}</p>

        </div>

        <div class="card">

            <h2>Syntax Status</h2>

            <p><strong>Status :</strong> {{ syntax.status }}</p>

            <p><strong>Message :</strong> {{ syntax.message }}</p>

        </div>

        <div class="card">

            <h2>Submitted Code</h2>

            <pre>{{ source_code }}</pre>

        </div>

        <div class="buttons">

            <a href="/">
                <button>Analyze Another File</button>
            </a>

        </div>

    </div>

</body>

</html>
